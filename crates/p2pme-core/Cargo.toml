[package]
name = "p2pme-core"
version = "0.1.0"
edition = "2021"
description = "High-performance decentralized P2P data replication and streaming engine"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
blake3 = "1.5"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "6.1"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
data-encoding = "2.6"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
bytes = "1.6"
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
tempfile = "3.10"
