[package]
name = "p2pme-ffi"
version = "0.1.0"
edition = "2021"
description = "C-compatible FFI bindings for P2Pme core engine"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
p2pme-core = { path = "../p2pme-core" }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
libc = "0.2"
blake3 = "1.5"
rand = "0.8"

